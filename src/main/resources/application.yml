spring:
  application:
    name: pedacinho-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      # MongoDB Atlas em todos os ambientes (dev e prod) — sem default aqui de
      # propósito. Não há mais um MongoDB local de fallback: o valor precisa
      # vir de MONGODB_URI (string de conexão do Atlas, formato
      # mongodb+srv://...) em qualquer ambiente que rodar esta aplicação.
      uri: ${MONGODB_URI}
      auto-index-creation: false # índices são geridos explicitamente por MongoIndexInitializer

server:
  # Render injeta PORT automaticamente (não SERVER_PORT) e espera a aplicação
  # escutar nela — fallback aninhado preserva 100% a configuração local
  # existente (SERVER_PORT, depois 8080) sem remover nada, só adiciona PORT
  # como primeira opção quando presente.
  port: ${PORT:${SERVER_PORT:8080}}
  # Limita o tamanho do corpo da requisição — primeira linha de defesa contra
  # payload flooding, antes de qualquer rate limiting (que entra numa fase futura).
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB

app:
  cors:
    # Customer App e Kitchen Dashboard são 2 deploys estáticos separados,
    # cada um numa porta própria durante o desenvolvimento local (ver README
    # da raiz do projeto) — por isso a lista cobre as duas portas padrão
    # instruídas (5500 e 5501), não só uma. Em produção, sobrescrito via
    # variável de ambiente com os domínios reais de cada frontend.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501}
  # Retenção de pedidos no MongoDB via índice TTL. Configurável e alterável em
  # runtime (ver MongoIndexInitializer.updateRetentionDays) sem downtime.
  order-retention-days: ${ORDER_RETENTION_DAYS:30}

  whatsapp:
    # api-url não é segredo — tem default público. phone-number-id e
    # access-token são credenciais reais do WhatsApp Business e NÃO têm
    # default: precisam vir de variável de ambiente em qualquer ambiente,
    # mesmo padrão já usado acima para MONGODB_URI. Os valores "teste"
    # anteriores nunca teriam funcionado contra a Cloud API de verdade —
    # eram placeholder esquecido, não configuração intencional.
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v23.0}
    # Default vazio (não obrigatório) de propósito: diferente de MONGODB_URI,
    # que já era documentado como obrigatório em qualquer ambiente, a
    # integração de WhatsApp é opcional e sua falha já é tratada de forma
    # graciosa (ver WhatsAppCloudApiMessageSender — loga o erro, não derruba
    # a requisição). Faltar essas duas variáveis não deve impedir o boot da
    # aplicação, só faz o envio de WhatsApp falhar quando disparado — mesmo
    # comportamento de antes, sem mais um valor-fantasma parecendo real.
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    # NOVO (Fase 2A). Sem default de propósito, mesmo padrão de
    # WHATSAPP_ACCESS_TOKEN acima — número real da dona, não hardcoded.
    # Ausente = SendApprovalRequestWhatsAppMessageUseCase loga e segue sem
    # enviar (mesmo comportamento gracioso do resto da integração).
    owner-phone-number: ${WHATSAPP_OWNER_PHONE_NUMBER:}

  # NOVO (Fase 2A). Capability token de aprovação de cadastro.
  approval:
    token-expiration-hours: ${APPROVAL_TOKEN_EXPIRATION_HOURS:48}
    # Necessário para montar os links absolutos de accept/reject enviados
    # ao WhatsApp da dona. Em produção precisa ser a URL real do Render.
    base-url: ${APP_BASE_URL:http://localhost:8080}

# NOVO (Fase 2A). Sem default para o secret — mesmo padrão de MONGODB_URI:
# obrigatório em qualquer ambiente, nunca hardcoded.
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.pedacinhodemaria: INFO
