spring:
  application:
    name: pedacinho-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      # MongoDB Atlas em todos os ambientes (dev e prod) — sem default aqui de
      # propósito. Não há mais um MongoDB local de fallback: o valor precisa
      # vir de MONGODB_URI (string de conexão do Atlas, formato
      # mongodb+srv://...) em qualquer ambiente que rodar esta aplicação.
      uri: ${MONGODB_URI}
      auto-index-creation: false # índices são geridos explicitamente por MongoIndexInitializer

server:
  # Render injeta PORT automaticamente (não SERVER_PORT) e espera a aplicação
  # escutar nela — fallback aninhado preserva 100% a configuração local
  # existente (SERVER_PORT, depois 8080) sem remover nada, só adiciona PORT
  # como primeira opção quando presente.
  port: ${PORT:${SERVER_PORT:8080}}
  # Limita o tamanho do corpo da requisição — primeira linha de defesa contra
  # payload flooding, antes de qualquer rate limiting (que entra numa fase futura).
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB

app:
  cors:
    # Customer App e Kitchen Dashboard são 2 deploys estáticos separados,
    # cada um numa porta própria durante o desenvolvimento local (ver README
    # da raiz do projeto) — por isso a lista cobre as portas padrão
    # instruídas (5500, 5501) e também 8081 (servidor HTTP simples usado
    # localmente para o Kitchen Dashboard/Admin App neste projeto). Em
    # produção, sobrescrito via variável de ambiente com os domínios reais
    # de cada frontend.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501,http://localhost:8081,http://127.0.0.1:8081}
  # Retenção de pedidos no MongoDB via índice TTL. Configurável e alterável em
  # runtime (ver MongoIndexInitializer.updateRetentionDays) sem downtime.
  order-retention-days: ${ORDER_RETENTION_DAYS:30}

  whatsapp:
    # api-url não é segredo — tem default público. phone-number-id e
    # access-token são credenciais reais do WhatsApp Business e NÃO têm
    # default: precisam vir de variável de ambiente em qualquer ambiente.
    # Usadas exclusivamente pelo aviso de "pedido pronto" — a antiga
    # aprovação de usuário via WhatsApp foi removida, e com ela a property
    # app.whatsapp.owner-phone-number (órfã, removida também).
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v23.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}

  # NOVO. Primeira conta OWNER — criada de forma idempotente no startup
  # (ver OwnerSeeder) se ainda não existir nenhum usuário com role OWNER.
  # Sem default de propósito: se não configuradas, o seeder loga um aviso
  # e não cria nada, sem impedir o boot da aplicação.
  owner:
    email: ${OWNER_EMAIL:}
    password: ${OWNER_PASSWORD:}
    name: ${OWNER_NAME:Proprietária}

# Sem default para o secret — mesmo padrão de MONGODB_URI:
# obrigatório em qualquer ambiente, nunca hardcoded.
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.pedacinhodemaria: INFO
