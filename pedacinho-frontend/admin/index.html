<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedacinhos de Maria — Administração</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div id="login-gate" class="auth-gate">
    <div class="auth-card">
        <h1 class="auth-card__title">Pedacinhos de Maria</h1>
        <p class="auth-card__subtitle">Painel Administrativo</p>

        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" name="email" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="login-password">Senha</label>
                <input type="password" id="login-password" name="password" required autocomplete="current-password">
            </div>
            <p id="login-error" class="form-error hidden" role="alert"></p>
            <button type="submit" id="login-submit" class="btn btn--primary auth-form__submit">Entrar</button>
        </form>
    </div>
</div>

<div id="panel" class="panel hidden">
    <header class="panel__header">
        <h1>Painel Administrativo</h1>
        <span class="panel__owner-badge">OWNER</span>
        <button id="logout-button" type="button" class="btn panel__logout">Sair</button>
    </header>

    <p id="panel-error" class="panel-error hidden" role="alert"></p>

    <nav class="filter-tabs">
        <button type="button" class="filter-tab filter-tab--active" data-status="">Todos</button>
        <button type="button" class="filter-tab" data-status="PENDING">Pendentes</button>
        <button type="button" class="filter-tab" data-status="APPROVED">Aprovados</button>
        <button type="button" class="filter-tab" data-status="REJECTED">Rejeitados</button>
    </nav>

    <div id="users-list" class="users-list"></div>
    <p id="empty-message" class="empty-message hidden">Nenhum usuário encontrado.</p>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
