name: Keep Render Backend Awake

on:
  schedule:
    # ALTERADO: de */5 (nao entregava a cadencia configurada na pratica -
    # ver runs #822-#831 com gaps reais de 2-4h) para 1x por hora. A
    # prioridade de cobertura fina (~4min) agora vive exclusivamente no
    # workflow keep-alive-critical-window.yml, cobrindo 10:30-16:15 BRT.
    # Este workflow cobre o restante do dia com cadencia mais simples e
    # menos exigente do scheduler do GitHub, sem pretender resolver a
    # causa exata dos atrasos observados (nao comprovada).
    - cron: "0 * * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render Backend
        run: |
          curl \
            --silent \
            --show-error \
            --fail \
            --retry 5 \
            --retry-delay 15 \
            --retry-all-errors \
            --max-time 120 \
            -H "X-Keep-Alive-Source: github-actions-hourly" \
            https://pedacinho-de-maria.onrender.com/internal/keep-alive