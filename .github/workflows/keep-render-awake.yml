name: Keep Render Backend Awake

on:
  schedule:
    # Executa aproximadamente a cada 5 minutos. O GitHub Actions NÃO
    # garante essa cadência — schedules frequentes podem sofrer
    # atraso/descarte do lado da plataforma (best-effort, documentado
    # pelo próprio GitHub). Isso está fora do controle deste arquivo.
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    # NOVO: evita que um run travado (ex.: problema de rede do runner)
    # fique ocupando o job indefinidamente.
    timeout-minutes: 5

    steps:
      - name: Ping Render Backend
        run: |
          curl \
            --silent \
            --show-error \
            --fail \
            --retry 5 \
            --retry-delay 15 \
            --retry-all-errors \
            --max-time 120 \
            https://pedacinho-de-maria.onrender.com/internal/keep-alive