name: Keep Render Awake - Critical Window

on:
  schedule:
    # Dois disparos para contornar o teto de 6h por job do GitHub Actions
    # e reduzir a dependencia de um unico horario de disparo, dado o
    # atraso de scheduler observado em teste real (~3h). Nenhum dos dois
    # cancela o outro - sem bloco concurrency, os dois podem rodar
    # simultaneamente sem problema (endpoint idempotente e sem estado).
    - cron: "0 10 * * *"      # 07:00 BRT (10:00 UTC)
    - cron: "15 13 * * *"     # 10:15 BRT (13:15 UTC)

  workflow_dispatch:

jobs:
  keep-alive-window:
    runs-on: ubuntu-latest
    # Teto absoluto do GitHub Actions para jobs em runners ubuntu-latest e
    # 360 min (6h), nao configuravel. 355 e a rede de seguranca do proprio
    # GitHub - quem controla a duracao real pretendida e o calculo de
    # DURATION dentro do script, valido igualmente para os dois disparos.
    timeout-minutes: 355

    steps:
      - name: Ping backend ate 16:15 BRT (19:15 UTC), com pisos de seguranca
        run: |
          NOW_EPOCH=$(date -u +%s)

          # Alvo operacional real: manter o backend aquecido ate 16:15
          # BRT, nao "rodar por N horas a partir de quando o scheduler
          # disparou". Identico para os dois disparos - a formula abaixo
          # se adapta sozinha ao horario real de inicio de cada execucao.
          TARGET_END_EPOCH=$(date -u -d "$(date -u +%Y-%m-%d) 19:15:00" +%s)

          # Piso: garante pelo menos 30min de ping mesmo se o scheduler
          # atrasar tanto que o horario-alvo (19:15 UTC) ja tenha passado
          # ou esteja muito proximo quando o job realmente comecar.
          MIN_DURATION_SECONDS=$((30 * 60))

          # Teto de seguranca: protege contra a duracao calculada
          # ultrapassar os 360min rigidos do GitHub Actions.
          MAX_DURATION_SECONDS=$((355 * 60))

          REMAINING=$((TARGET_END_EPOCH - NOW_EPOCH))

          if [ "$REMAINING" -lt "$MIN_DURATION_SECONDS" ]; then
            DURATION=$MIN_DURATION_SECONDS
            MODE="floor_fallback"
          elif [ "$REMAINING" -gt "$MAX_DURATION_SECONDS" ]; then
            DURATION=$MAX_DURATION_SECONDS
            MODE="capped_safety"
          else
            DURATION=$REMAINING
            MODE="absolute_target"
          fi

          END_EPOCH=$((NOW_EPOCH + DURATION))

          # NOVO: trigger_cron identifica qual das duas entradas de
          # schedule disparou esta execucao (o GitHub substitui essa
          # expressao pelo valor real do cron correspondente antes do
          # shell rodar). Em disparo manual (workflow_dispatch), este
          # campo vem vazio - comportamento esperado, nao e erro.
          echo "KEEP_ALIVE_START mode=$MODE trigger_cron=${{ github.event.schedule }} start_utc=$(date -u -d "@$NOW_EPOCH" +'%Y-%m-%dT%H:%M:%SZ') end_utc=$(date -u -d "@$END_EPOCH" +'%Y-%m-%dT%H:%M:%SZ') duration_min=$((DURATION / 60))"

          while [ "$(date -u +%s)" -lt "$END_EPOCH" ]; do
            TS=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            echo "KEEP_ALIVE_PING timestamp=$TS"

            if curl --silent --show-error --fail \
                --max-time 30 \
                -H "X-Keep-Alive-Source: github-actions" \
                https://pedacinho-de-maria.onrender.com/internal/keep-alive; then
              echo "KEEP_ALIVE_SUCCESS timestamp=$TS"
            else
              echo "KEEP_ALIVE_FAILURE timestamp=$TS"
            fi

            sleep 240
          done

          echo "KEEP_ALIVE_END timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"